name: Release

# Builds the Claude.ai `.skill` bundle and attaches it to the GitHub Release for
# a plugin tag. The v0.2.0 asset was uploaded by hand and landed as
# `verifyaxapi.skill` instead of `verifyax-api.skill`; building it here keeps the
# name tied to scripts/build-skill.sh instead of to whoever ran the upload.
#
# Tag format: <plugin>-v<version>, e.g. verifyax-api-v0.3.0.

on:
  push:
    tags:
      - "verifyax-api-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and attach the bundle to"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate manifests
        run: node scripts/check-manifests.mjs

      - name: Resolve plugin and version from the tag
        id: tag
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # verifyax-api-v0.3.0 -> plugin=verifyax-api, version=0.3.0
          plugin="${RAW_TAG%-v*}"
          version="${RAW_TAG##*-v}"
          if [ -z "$plugin" ] || [ -z "$version" ] || [ "$plugin" = "$RAW_TAG" ]; then
            echo "tag '$RAW_TAG' is not in <plugin>-v<version> form" >&2
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Assert the tag matches the plugin manifest
        env:
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # A tag that disagrees with plugin.json would ship a bundle labelled with
          # a version the manifest never declared.
          manifest="plugins/$PLUGIN/.claude-plugin/plugin.json"
          declared=$(node -e "process.stdout.write(require('./$manifest').version)")
          if [ "$declared" != "$VERSION" ]; then
            echo "tag says $VERSION but $manifest declares $declared" >&2
            exit 1
          fi
          echo "$manifest declares $declared — matches the tag"

      - name: Build the .skill bundle
        env:
          PLUGIN: ${{ steps.tag.outputs.plugin }}
        run: bash scripts/build-skill.sh "$PLUGIN"

      - name: Verify the bundle name and layout
        env:
          PLUGIN: ${{ steps.tag.outputs.plugin }}
        run: |
          out="dist/$PLUGIN.skill"
          test -f "$out" || { echo "expected $out to exist"; exit 1; }
          top=$(unzip -Z1 "$out" | cut -d/ -f1 | sort -u)
          [ "$top" = "$PLUGIN" ] || { echo "unexpected top-level entry: [$top]"; exit 1; }
          unzip -Z1 "$out" | grep -qx "$PLUGIN/SKILL.md" \
            || { echo "$PLUGIN/SKILL.md missing from the bundle"; exit 1; }
          echo "bundle OK: $out"

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # Create the release if the tag doesn't have one yet; otherwise just
          # replace the asset, leaving hand-written release notes untouched.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$PLUGIN $VERSION" \
              --notes "See [\`CHANGELOG.md\`](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for release notes."
          fi
          gh release upload "$TAG" "dist/$PLUGIN.skill" --clobber
