name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate manifests and version consistency
        run: node scripts/check-manifests.mjs

      - name: Shellcheck build scripts
        # severity=error for the initial gate (catches real bugs without blocking
        # on style warnings); tighten to the default once the scripts are clean.
        run: shellcheck --severity=error scripts/*.sh plugins/verifyax-claude-agent/sandbox/*.sh

      - name: Build and verify the .skill bundle
        run: |
          bash scripts/build-skill.sh verifyax-api
          test -f dist/verifyax-api.zip || { echo "zip bundle was not produced"; exit 1; }
          test -f dist/verifyax-api.skill || { echo "legacy bundle was not produced"; exit 1; }
          # The two assets must stay the same archive, or users get different content
          # depending on which extension they happened to download.
          cmp dist/verifyax-api.zip dist/verifyax-api.skill             || { echo ".zip and .skill differ"; exit 1; }
          # Exactly one top-level entry, named after the skill, containing SKILL.md.
          top=$(unzip -Z1 dist/verifyax-api.zip | cut -d/ -f1 | sort -u)
          [ "$top" = "verifyax-api" ] || { echo "unexpected top-level entry: [$top]"; exit 1; }
          unzip -Z1 dist/verifyax-api.zip | grep -qx "verifyax-api/SKILL.md" \
            || { echo "verifyax-api/SKILL.md missing from the bundle"; exit 1; }
          echo "bundle OK"

  claude-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: plugins/verifyax-claude-agent/adapter/requirements.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: requirements.lock must agree with requirements.txt
        # Dependabot bumps requirements.txt and leaves the lock alone -- it did
        # exactly that twice (uvicorn #26, a2a-sdk #36). Nothing installs from
        # requirements.txt: CI and the sandbox image both use the lock, so those
        # PRs went green while every real environment kept the old version, and
        # the two files silently disagreed about what this plugin depends on.
        run: |
          python -m pip install --quiet pip-tools==7.5.1
          cp plugins/verifyax-claude-agent/adapter/requirements.lock /tmp/lock.before
          pip-compile --quiet --generate-hashes --no-emit-index-url \
            --output-file=plugins/verifyax-claude-agent/adapter/requirements.lock \
            --strip-extras plugins/verifyax-claude-agent/adapter/requirements.txt
          if ! diff -u /tmp/lock.before \
               plugins/verifyax-claude-agent/adapter/requirements.lock; then
            echo "::error::requirements.lock is stale. Regenerate it with the command in its header and commit the result."
            exit 1
          fi
          echo "lock is in sync with requirements.txt"

      - name: Install locked Python runtime
        run: |
          python -m pip install --require-hashes \
            -r plugins/verifyax-claude-agent/adapter/requirements.lock

      - name: Import, compile, and test executable plugin
        env:
          PYTHONPATH: plugins/verifyax-claude-agent/adapter
        run: |
          python -m compileall -q \
            plugins/verifyax-claude-agent/adapter \
            plugins/verifyax-claude-agent/scripts/tunnel.py
          python -m unittest discover \
            -s plugins/verifyax-claude-agent/adapter/tests -v

      - name: Verify pinned Claude Code tools-off capability
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.263
          export PATH="$(npm prefix -g)/bin:$PATH"
          npm ls -g --depth=0 @anthropic-ai/claude-code@2.1.263
          version=$(claude --version)
          echo "claude --version: ${version}"
          echo "$version" | grep -F '2.1.263'
          # --help wraps this across two lines: 'Use "" to disable all' / 'tools, ...'
          claude --help | grep -F 'Use "" to disable all'

      - name: Validate pinned sandbox definition
        run: docker build --check -f plugins/verifyax-claude-agent/sandbox/Dockerfile plugins/verifyax-claude-agent

      - name: Build the sandbox image
        # `--check` above only lints the Dockerfile — it never executes a RUN
        # step, so it passes on a base image the build cannot actually use. A
        # node 20 -> 26 bump linted clean and then failed here: the newer Debian
        # ships a distro `packaging` with no RECORD file, which pip refuses to
        # replace under --break-system-packages. Build it for real so a base
        # image or dependency bump can't merge green and break the sandbox.
        run: |
          docker build -t cvx-sandbox-ci \
            -f plugins/verifyax-claude-agent/sandbox/Dockerfile \
            plugins/verifyax-claude-agent

      - name: Verify the sandbox runtime identity
        # The image reclaims UID/GID 1000 from the base image's `node` account so
        # run.sh's uid=1000 tmpfs mounts stay writable. A base image that stops
        # owning 1000, or names that account differently, breaks the mounts at
        # run time rather than at build time.
        run: |
          id_out=$(docker run --rm --entrypoint id cvx-sandbox-ci)
          echo "sandbox id: $id_out"
          echo "$id_out" | grep -q 'uid=1000(agent)' || { echo "expected uid=1000(agent)"; exit 1; }
          echo "$id_out" | grep -q 'gid=1000(agent)' || { echo "expected gid=1000(agent)"; exit 1; }
